    <script>
      // Early compatibility shims for Smart TV / ViewBoard Chromium 74-108 WebViews
      if (typeof globalThis === 'undefined') {
        window.globalThis = window;
      }
      if (!String.prototype.replaceAll) {
        String.prototype.replaceAll = function(search, replacement) {
          if (search instanceof RegExp) {
            return this.replace(search, replacement);
          }
          return this.split(String(search)).join(String(replacement));
        };
      }
      if (!Object.hasOwn) {
        Object.hasOwn = function(obj, prop) {
          return Object.prototype.hasOwnProperty.call(Object(obj), prop);
        };
      }
      if (!Array.prototype.at) {
        Array.prototype.at = function(n) {
          var i = Math.trunc(n) || 0;
          if (i < 0) i += this.length;
          if (i < 0 || i >= this.length) return undefined;
          return this[i];
        };
      }
      if (typeof window.structuredClone !== 'function') {
        window.structuredClone = function(val) {
          return val === undefined ? undefined : JSON.parse(JSON.stringify(val));
        };
      }
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Gracefully handle Vite WebSocket / HMR disconnects in preview environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = (event.reason.message || String(event.reason) || '');
          if (msg.includes('WebSocket') || msg.includes('vite-hmr') || msg.includes('failed to connect to websocket')) {
            event.preventDefault();
            console.debug('[Vite HMR Guard] Handled gracefully:', msg);
          }
        }
      });
      // Prevent Vite CSS/module preload errors from crashing lazy component rendering on Smart TVs
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[MyStudyZone Preload Notice]: Handled preload error gracefully.');
      });
      // Capture PWA beforeinstallprompt early so late-mounted components can always trigger native install
      window.__mszDeferredInstallPrompt = null;
      window.__mszAppInstalled = false;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__mszDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('msz-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__mszDeferredInstallPrompt = null;
        window.__mszAppInstalled = true;
        window.dispatchEvent(new CustomEvent('msz-pwa-installed'));
      });
    </script>
